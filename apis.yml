- aid: viagogo:viagogo-webhooks-api
  name: viagogo Webhooks API
  description: Subscribe a server application to viagogo platform topics — create,
    read, update, delete and ping webhooks, each configured with a callback url, an
    Authorization header value and a set of topics such as sales, sale updates, seller
    listing updates, provisional sales and ticket re-transfer.
  humanURL: https://developer.viagogo.net/api-reference/webhooks
  baseURL: https://api.viagogo.net/v2
