- aid: viagogo:viagogo-account-api
  name: viagogo Account API
  description: Manage the authenticated viagogo user — read and update the user profile,
    list, create, update and delete addresses, and list the payment methods available
    for a listing.
  humanURL: https://developer.viagogo.net/api-reference/account
