apis:
- aid: viagogo:viagogo-catalog-api
  name: viagogo Catalog API
  description: Read the viagogo event catalog — search and list categories, events
    and venues, resolve events by external platform identifier, map inbound event/venue/category
    requests onto the platform, read venue configurations, and place and manage instant-liquidity
    listing offers (buyer bids) against an event.
  humanURL: https://developer.viagogo.net/api-reference/catalog
