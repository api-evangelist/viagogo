- aid: viagogo:viagogo-sales-api
  name: viagogo Sales API
  description: Work the seller side of a viagogo sale — list and read sales and recent
    updates, confirm, update or reject a sale, read ticket holder details, upload
    e-tickets and proof of transfer, print and update shipping labels, and read seller
    payments including a preview of the next payment.
  humanURL: https://developer.viagogo.net/api-reference/sales
  baseURL: https://api.viagogo.net/v2
  tags:
