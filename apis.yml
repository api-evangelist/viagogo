aid: viagogo
name: viagogo
description: 'viagogo is a global online ticket marketplace for live events — concerts,
  sport and theatre — operating in more than 90 countries and, since the 2020 acquisition
  of StubHub, part of StubHub Holdings. viagogo publishes a public developer program
  at developer.viagogo.net covering five OAuth2-secured HTTP APIs — Catalog (events,
  venues, categories and instant-liquidity listing offers), Account (users, addresses,
  payment methods), Inventory (seller listings, listing constraints, e-tickets and
  shipments), Sales (sales, payments, ticket holders, transfer proof) and Webhooks
  (topic subscriptions) — all served from api.viagogo.net over application/hal+json
  with a matching sandbox.api.viagogo.net environment, official GogoKit client libraries
  for .NET, Python, Ruby and PHP, and machine-readable OpenAPI 3.0 definitions synced
  nightly from the API host into the public docs repository.'
url: https://raw.githubusercontent.com/api-evangelist/viagogo/refs/heads/main/apis.yml
