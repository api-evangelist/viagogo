- aid: viagogo:viagogo-inventory-api
  name: viagogo Inventory API
  description: Manage seller inventory on the viagogo platform — create, preview,
    update and delete seller listings (by viagogo id or by your own external id),
    read listing constraints, create seller and requested events, upload and mark
    back e-tickets, and print and update shipping labels for listings.
  humanURL: https://developer.viagogo.net/api-reference/inventory
  baseURL: https://api.viagogo.net/v2
  tags:
  - Inventory
  - Listings
  - E-Tickets
  - Shipments
