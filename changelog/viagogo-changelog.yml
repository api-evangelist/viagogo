- title: TLS v1.0 Deprecation Notice
  date: '2018-06-30'
  url: https://developer.viagogo.net/blog/2018/06/30/tls-deprecation-notice
  tags:
  - tls
  - deprecation
  - breaking-change
  breaking: true
  additions: []
  highlights:
  - viagogo will disable support for TLS v1.0 on the public-facing API.
  - Flagged as a possible breaking change for clients connecting over TLS 1.0.
  - Driven by PCI Security Standards Council guidance requiring full deprecation of
    TLS 1.0 for applications that process payments; applied across all inbound
    connections.
  - Advance notice given so customers and partners could prepare.
