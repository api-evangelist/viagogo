pagination:
  style: page-number
  default_page_size: 100
  params:
  - name: page
    in: query
    type: integer
    description: Which page of data to retrieve. 1-based; omitting it returns the
      first page.
  - name: page_size
    in: query
    type: integer
    description: Custom page size on the API response.
  response_fields:
  - total_items
  - page
  - page_size
  - _links
  - _embedded
  link_rels:
  - first
  - prev
  - next
  - last
  guidance: API responses return pre-built pagination links with rels first, prev,
    next and last, and client applications are encouraged to follow these links for
    pagination.
  docs: https://developer.viagogo.net/docs/overview/pagination

sorting:
  param: sort
  style: comma-separated field list
  descending_prefix: '-'
  default_order: ascending
  example: GET https://api.viagogo.net/inventory/sellerlistings?sort=event_date,-price
  docs: https://developer.viagogo.net/docs/overview/sorting

sparse_fieldsets:
  param: fields
  typed_param: fields[TYPE]
  style: comma-separated field name list, per resource type
  example: GET https://api.viagogo.net/v2/events/4695621?fields=id,name,_embedded&fields[venue]=city
  docs: https://developer.viagogo.net/docs/overview/sparse-fieldsets

incremental_sync:
  supported: true
  params:
  - name: updated_since
    type: date-time
    description: Filters the response to only return items updated since the given
      timestamp.
  - name: min_resource_version
    type: uint64
    description: Lower bound on the monotonic resource_version cursor.
  sort_key: resource_version
  operations:
  - Events_GetEvents
  - SellerListings_GetSellerListingsRecentUpdates
  - Sales_GetSalesRecentUpdates

idempotency:
  supported: false
  idempotency_key_header: null
  statement: >-
    viagogo publishes no idempotency-key mechanism. No operation in any of the five
    OpenAPI definitions declares an Idempotency-Key (or equivalent) header parameter,
    and the documentation does not describe safe retry semantics for POST.
  closest_mechanism:
    field: external_id
    scope: seller listings
    operations:
    - SellerListings_CreateListingForRequestedEvent
    - SellerListings_CreateListing
    - SellerListings_GetByExternalListingId
    - SellerListings_PatchByExternalListingId
    - SellerListings_DeleteListingByExternalListingId
    docs: https://developer.viagogo.net/docs/guides/creating-a-listing
    published_semantics: >-
      "To prevent duplication of listings in our system due to race conditions, it
      is recommended that you provide an external_id (the Id of the listing in your
      system when creating a listing). If an attempt is made to create a listing
      with an external_id that already exists for your user, then we will delete the
      old listing and create the new one."
    assessment: >-
      This is a client-supplied correlation key for de-duplication, NOT idempotency.
      Replaying the same request deletes the previous listing and creates a new one
      with a new viagogo listing id, so the operation is not idempotent and a retry
      is not a no-op. Recorded here so integrators are not misled into treating
      external_id as a safe-retry token.

