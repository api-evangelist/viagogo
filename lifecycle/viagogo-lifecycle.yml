notes: >-
  viagogo runs a real but sparse lifecycle surface. Version numbers are carried in
  each OpenAPI `info.version` and the definitions are re-synced from the API host
  nightly, so version drift is publicly observable. Deprecation is communicated
  through the developer-portal Announcements blog, which has a `breaking-change`
  and a `deprecation` tag — but only one dated entry, from 2018. No status page, no
  SLA and no Sunset/Deprecation header policy (RFC 8594) were found; those absences
  are recorded rather than assumed.

versioning:
  scheme: path-prefix + four-part spec version
  path_versions:
  - prefix: /v2
    apis:
    - viagogo Account API
    - viagogo Inventory API
    - viagogo Sales API
    - viagogo Webhooks API
    spec_version: 2.249.0.0
  - prefix: (unversioned)
    apis:
    - viagogo Catalog API
    spec_version: 1.0.0.49
  spec_version_field: info.version
  version_negotiation: none published (no version header, no query parameter)
  policy_page: null

spec_publication:
  machine_readable: true
  canonical_locations:
  - https://api.viagogo.net/v2/openapi/account.json
  - https://api.viagogo.net/catalog/openapi/openapi.json
  - https://api.viagogo.net/v2/openapi/inventory.json
  - https://api.viagogo.net/v2/openapi/sales.json
  - https://api.viagogo.net/v2/openapi/webhooks.json
  mirror: https://github.com/viagogo/viagogo-api-docs/tree/main/static/openapi
  sync: >-
    A scheduled GitHub Action (.github/workflows/sync-openapi-definitions.yml, cron
    "0 0 * * *") pulls each definition from the API host nightly and opens a pull
    request when it changes. The docs mirror can therefore lag the API host by up to
    a day — as of this probe the mirrored Catalog spec was 1.0.0.40 / 10 paths while
    the API host served 1.0.0.49 / 17 paths.

