        - read:sellerlistings
    patch:
      tags:
      - E-Tickets
      summary: Mark-back e-tickets from a seller listing
      description: Removes a certain number of e-tickets that you no longer wish to sell from your listing.
      operationId: ETicket_MarkBackETickets
